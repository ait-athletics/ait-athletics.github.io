  .nc-dots{ display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; max-width:100%; }

<script>
(function(){
  var AUTO_MS = 5000; /* 【調整】1枚あたりの表示時間（ミリ秒）＝5秒 */
  var carousels = document.querySelectorAll('.news-carousel');
  if(!carousels.length){ return; }
  Array.prototype.forEach.call(carousels, function(carousel){
    var track  = carousel.querySelector('.nc-track');
    var slides = carousel.querySelectorAll('.nc-slide');
    var dots   = carousel.querySelectorAll('.nc-dot');
    var videos = carousel.querySelectorAll('.nc-video');
    var capEl  = carousel.querySelector('.nc-cap');
    var count  = slides.length;
    var idx    = 0;
    if(!track || !count){ return; }
    var timer = null, visible = false, hovered = false;
    function currentVideoPlaying(){ var v = slides[idx].querySelector('video'); return !!(v && !v.paused && !v.ended); }
    function stopAuto(){ if(timer){ clearInterval(timer); timer = null; } }
    function startAuto(){ stopAuto(); if(count < 2){ return; }
      timer = setInterval(function(){ if(currentVideoPlaying()){ return; } go(idx + 1); }, AUTO_MS); }
    function maybeAuto(){ if(visible && !hovered && !currentVideoPlaying()){ startAuto(); } else { stopAuto(); } }
    function go(nn){
      idx = (nn + count) % count;
      track.style.transform = 'translateX(' + (-idx * 100) + '%)';
      for(var v = 0; v < videos.length; v++){ if(!slides[idx].contains(videos[v])){ try{ videos[v].pause(); }catch(e){} } }
      for(var i = 0; i < dots.length; i++){ dots[i].classList.toggle('is-active', i === idx); }
      if(capEl){ capEl.textContent = (idx + 1) + ' / ' + count; }
    }
    function goManual(nn){ go(nn); maybeAuto(); }
    var prev = carousel.querySelector('.nc-prev'); var next = carousel.querySelector('.nc-next');
    if(prev){ prev.addEventListener('click', function(){ goManual(idx - 1); }); }
    if(next){ next.addEventListener('click', function(){ goManual(idx + 1); }); }
    for(var d = 0; d < dots.length; d++){ (function(i){ dots[i].addEventListener('click', function(){ goManual(i); }); })(d); }
    carousel.addEventListener('keydown', function(e){ if(e.key === 'ArrowLeft'){ goManual(idx - 1); } else if(e.key === 'ArrowRight'){ goManual(idx + 1); } });
    carousel.addEventListener('mouseenter', function(){ hovered = true; maybeAuto(); });
    carousel.addEventListener('mouseleave', function(){ hovered = false; maybeAuto(); });
    carousel.addEventListener('focusin',  function(){ hovered = true; maybeAuto(); });
    carousel.addEventListener('focusout', function(){ hovered = false; maybeAuto(); });
    for(var vi = 0; vi < videos.length; vi++){
      videos[vi].addEventListener('play',  function(){ stopAuto(); });
      videos[vi].addEventListener('pause', function(){ maybeAuto(); });
      videos[vi].addEventListener('ended', function(){ go(idx + 1); maybeAuto(); });
    }
    var startX = null, startY = null, dx = 0, dy = 0;
    var vp = carousel.querySelector('.nc-viewport');
    vp.addEventListener('touchstart', function(e){ hovered = true; stopAuto(); startX = e.touches[0].clientX; startY = e.touches[0].clientY; dx = 0; dy = 0; }, {passive:true});
    vp.addEventListener('touchmove',  function(e){ if(startX !== null){ dx = e.touches[0].clientX - startX; dy = e.touches[0].clientY - startY; } }, {passive:true});
    vp.addEventListener('touchend',   function(){
      if(startX !== null){ if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ if(dx < 0){ go(idx + 1); } else { go(idx - 1); } } startX = null; startY = null; dx = 0; dy = 0; }
      hovered = false; maybeAuto();
    });
    if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries){ entries.forEach(function(en){ visible = en.isIntersecting; maybeAuto(); }); }, { threshold: 0.3 });
      io.observe(carousel);
    } else { visible = true; }
    go(0); maybeAuto();
  });
})();
</script>
